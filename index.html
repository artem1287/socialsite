<title>Statline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;700&display=swap">
<style>
/* Full-screen 3-column shell — nav rail · scrolling stat feed · live-ranking rail. */
:root{
  --bg:#f4f4f1;
  --surface:#ffffff;
  --surface-2:#f6f5f1;
  --line:#e8e7e2;
  --line-soft:#eeede9;
  --fg:#16171b;
  --fg-2:#3a3c42;
  --muted:#8a8c93;
  --faint:#b4b6bc;
  --axis:#c6c5bf;
  --accent:#4b57f5;
  --accent-soft:#edeefe;
  --ink:#15161b;
  --good:#1a9d66;
  --bad:#e0533b;
  --hair:rgba(23,24,30,.08);
  --c-economy:#4b57f5;  --c-economy-bg:#edeefe;
  --c-climate:#17a06a;  --c-climate-bg:#e7f6ef;
  --c-health:#e0533b;   --c-health-bg:#fcebe7;
  --c-sports:#d99a1f;   --c-sports-bg:#fbf1dc;
  --c-science:#7c5cff;  --c-science-bg:#f0ecff;
  --c-work:#2a2c33;     --c-work-bg:#ececef;
  --c-civics:#3b7de0;   --c-civics-bg:#e7f0fc;
  --card-shadow:0 2px 5px rgba(44,46,84,.05), 0 14px 30px rgba(44,46,84,.07);
  --f-sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-display:"Bricolage Grotesque","Hanken Grotesk",Arial,sans-serif;
  --f-mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f12; --surface:#15161a; --surface-2:#191a1f; --line:#26282e; --line-soft:#212329;
    --fg:#f2f2f4; --fg-2:#c9cad0; --muted:#8c8e96; --faint:#5a5c64; --axis:#43454c;
    --accent:#6b76ff; --accent-soft:#1d2140; --ink:#2c2e36; --good:#35b87d; --bad:#f06a52;
    --hair:rgba(255,255,255,.09);
    --c-economy:#6b76ff; --c-economy-bg:#1d2140;
    --c-climate:#34c088; --c-climate-bg:#122c22;
    --c-health:#f0715a; --c-health-bg:#331c18;
    --c-sports:#e6b145; --c-sports-bg:#2e2512;
    --c-science:#9b82ff; --c-science-bg:#221c3d;
    --c-work:#c9cad0; --c-work-bg:#24262c;
    --c-civics:#5a97ef; --c-civics-bg:#132339;
    --card-shadow:0 1px 3px rgba(0,0,0,.3),0 14px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f12; --surface:#15161a; --surface-2:#191a1f; --line:#26282e; --line-soft:#212329;
  --fg:#f2f2f4; --fg-2:#c9cad0; --muted:#8c8e96; --faint:#5a5c64; --axis:#43454c;
  --accent:#6b76ff; --accent-soft:#1d2140; --ink:#2c2e36; --good:#35b87d; --bad:#f06a52;
  --hair:rgba(255,255,255,.09);
  --c-economy:#6b76ff; --c-economy-bg:#1d2140;
  --c-climate:#34c088; --c-climate-bg:#122c22;
  --c-health:#f0715a; --c-health-bg:#331c18;
  --c-sports:#e6b145; --c-sports-bg:#2e2512;
  --c-science:#9b82ff; --c-science-bg:#221c3d;
  --c-work:#c9cad0; --c-work-bg:#24262c;
  --c-civics:#5a97ef; --c-civics-bg:#132339;
  --card-shadow:0 1px 3px rgba(0,0,0,.3),0 14px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--f-sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;letter-spacing:-.004em;
}
button{font-family:inherit;color:inherit;cursor:pointer}
::selection{background:var(--accent);color:#fff}

/* ---------- shell (full screen) ---------- */
.app{
  display:grid;
  grid-template-columns:262px minmax(0,1fr) 324px;
  min-height:100vh;
  background:var(--surface);
}

/* ---------- left rail ---------- */
.rail-l{
  position:sticky;top:0;height:100vh;
  padding:26px 18px 20px;
  display:flex;flex-direction:column;gap:6px;
  padding-left:max(18px,env(safe-area-inset-left,0px));
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.brand .mark{
  width:38px;height:38px;border-radius:13px;
  background:linear-gradient(140deg,#6b8cff,#a86bff 52%,#ff85b8);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;flex:none;
  box-shadow:0 6px 16px rgba(130,100,255,.4);
}
.brand .name{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.02em}
.nav-item{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:none;border:0;padding:13px 15px;border-radius:15px;
  color:var(--fg-2);font-weight:600;font-size:15.5px;transition:background .12s,color .12s;
}
.nav-item svg{width:20px;height:20px;flex:none;stroke:currentColor}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--ink);color:#fff;box-shadow:0 10px 22px rgba(17,18,22,.26)}
.nav-item.active svg{stroke:#fff}
.rail-sect{margin:16px 0 4px;padding:0 13px;display:flex;align-items:center;justify-content:space-between}
.rail-sect span{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--faint);}
.rail-sect svg{width:14px;height:14px;stroke:var(--faint)}
.topic{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:0;padding:9px 13px;border-radius:12px;
  color:var(--fg-2);font-weight:600;font-size:15px;transition:background .12s;
}
.topic:hover{background:var(--surface-2)}
.topic.on{background:var(--surface-2)}
.topic .dot{width:9px;height:9px;border-radius:50%;flex:none}
.topic.on .dot{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}
.divider{height:1px;background:var(--line);margin:14px 10px}
.spacer{flex:1}
.me{
  display:flex;align-items:center;gap:11px;padding:10px;border-radius:16px;
  background:var(--surface-2);
}
.me .av{width:36px;height:36px;border-radius:50%;background:#16171b;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
:root[data-theme="dark"] .me .av, :root:not([data-theme="light"]) .me .av{background:#2a2c33}
.me .who{min-width:0;flex:1}
.me .who b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who small{color:var(--muted);font-size:12.5px}
.me .more{margin-left:auto;color:var(--faint);letter-spacing:1px;background:none;border:0;font-size:18px;font-weight:800}

/* ---------- center feed ---------- */
.feed{min-width:0;padding:0 28px 80px}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:12px;
  padding:16px 2px 14px;
}
.tb-sp{flex:1}
.periods{display:inline-flex;gap:3px;background:var(--surface-2);padding:4px;border-radius:13px}
.periods .pl{align-self:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--faint);padding:0 8px 0 6px}
.periods button{border:0;background:none;padding:7px 12px;border-radius:9px;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);transition:background .12s,color .12s}
.periods button.on{background:var(--ink);color:#fff}
.periods button:hover:not(.on){color:var(--fg)}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;transition:background .12s,transform .08s;
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px;stroke:var(--fg-2)}
.icon-btn .bell-dot{position:absolute;margin:-14px 0 0 13px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

.tabsrow{display:flex;align-items:center;gap:22px;margin-bottom:24px}
.feed-title{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 auto 0 0;line-height:1}
.tab{background:none;border:0;padding:6px 0 8px;font-size:16px;font-weight:700;color:var(--muted);position:relative;letter-spacing:-.01em}
.tab.active{color:var(--fg)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);border-radius:3px}
.live-ind{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);}
.live-ind .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,157,102,.5)}70%{box-shadow:0 0 0 7px rgba(26,157,102,0)}100%{box-shadow:0 0 0 0 rgba(26,157,102,0)}}

.cards{display:flex;flex-direction:column;gap:20px}

/* ---------- stat card ---------- */
.card{border:0;border-radius:28px;box-shadow:var(--card-shadow);overflow:hidden;animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:20px 24px 6px}
.cat{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;font-weight:700;padding:5px 9px;border-radius:7px;flex:none}
.ago{color:var(--muted);font-size:13.5px;font-weight:500}
.region{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--fg-2)}
.region .flag{font-size:15px;line-height:1}
.dotsep{color:var(--faint)}
.bookmark{margin-left:8px;background:none;border:0;color:var(--faint);padding:2px;transition:color .12s,transform .1s}
.ct-sp{flex:1}
.cardrange{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;align-self:center}
.cardrange button{border:0;background:none;padding:4px 8px;border-radius:7px;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.cardrange button.on{background:var(--ink);color:#fff}
.cardrange button:hover:not(.on){color:var(--fg)}
.bookmark:hover{color:var(--fg-2)}
.bookmark:active{transform:scale(.88)}
.bookmark svg{width:20px;height:22px}
.bookmark.on{color:var(--accent)}
.bookmark.on svg path{fill:var(--accent)}

.card-body{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:20px;padding:6px 24px 18px;align-items:center}
.stat-num{font-family:var(--f-display);font-size:58px;line-height:1;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:10px 0 0}
.stat-label{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:14px 0 0;max-width:22ch}
.stat-range{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-top:22px}
.since{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;padding:6px 11px;border-radius:9px}
.since.up{color:var(--good);background:color-mix(in srgb,var(--good) 11%,transparent)}
.since.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.since .arw{font-size:14px;line-height:1}
.since em{font-style:normal;font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;margin-left:2px}

/* ---------- chart ---------- */
.chartwrap{position:relative;width:100%;height:196px;touch-action:none}
.chart{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.caxis{position:absolute;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.02em;pointer-events:none;white-space:nowrap;z-index:1;font-variant-numeric:tabular-nums}
.caxis.y{left:0;text-align:right;padding-right:10px;transform:translateY(-50%);font-size:12.5px;font-weight:700;color:var(--fg)}
.caxis.x{bottom:0;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--fg-2)}
.cunit{position:absolute;top:1px;right:2px;font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--faint);pointer-events:none;z-index:1}
.cvline{position:absolute;width:1px;background:var(--axis);opacity:0;pointer-events:none;z-index:2}
.cend{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--dotc);transform:translate(-50%,-50%);pointer-events:none;z-index:3;box-shadow:0 0 0 5px color-mix(in srgb,var(--dotc) 16%,transparent);transition:opacity .1s}
.cdot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--dotc);transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ctip{position:absolute;transform:translate(-50%,calc(-100% - 13px));background:var(--fg);color:var(--bg);padding:6px 11px;border-radius:9px;font-size:14px;font-weight:700;white-space:nowrap;text-align:center;opacity:0;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.ctip small{display:block;font-weight:500;opacity:.72;font-size:10.5px;letter-spacing:.02em;margin-top:2px;font-family:var(--f-mono)}
.chartwrap.hovering .cdot,.chartwrap.hovering .cvline,.chartwrap.hovering .ctip{opacity:1}

/* vertical bars */
.barchart{display:flex;gap:10px;align-items:flex-end;height:196px;width:100%}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.bar .bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar .bcol{width:70%;border-radius:8px 8px 3px 3px;min-height:4px;transition:height .3s}
.bar .bv{font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--fg)}
.bar .bn{font-size:11px;color:var(--muted);text-align:center;line-height:1.15;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ranking (horizontal bars) */
.hbars{display:flex;flex-direction:column;gap:9px;width:100%}
.hrow{display:grid;grid-template-columns:104px 1fr auto;align-items:center;gap:11px}
.hrow .hn{font-size:13px;color:var(--fg-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .htrack{background:var(--surface-2);border-radius:7px;height:15px;overflow:hidden}
.hrow .hfill{height:100%;border-radius:7px;transition:width .3s}
.hrow .hv{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--fg);text-align:right}
/* composition (donut) */
.donutwrap{display:flex;align-items:center;gap:20px;width:100%;flex-wrap:wrap}
.donut{flex:none}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:140px}
.leg{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:9px}
.leg .ld{width:11px;height:11px;border-radius:3px}
.leg .ln{font-size:13px;color:var(--fg-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .lv{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--fg)}

.meta{display:grid;grid-template-columns:1.4fr 1fr;border-top:1px solid var(--hair);background:transparent}
.meta>div{padding:15px 24px}
.meta>div+div{border-left:1px solid var(--hair)}
.meta dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;color:var(--faint);margin-bottom:5px}
.meta dd{margin:0;font-size:14px;font-weight:600;color:var(--fg-2)}
.meta .verified{color:var(--good);margin-left:3px}

.actions{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--hair)}
.act{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:9px 13px;border-radius:12px;color:var(--fg-2);font-weight:650;font-size:14px;transition:background .12s,color .12s}
.act svg{width:18px;height:18px;stroke:currentColor;fill:none}
.act:hover{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.act.up.on{color:var(--accent)}
.act.up.on svg{fill:var(--accent);stroke:var(--accent)}
.act .count{font-variant-numeric:tabular-nums}
.act .badge{background:color-mix(in srgb,var(--surface) 72%,transparent);border-radius:20px;padding:1px 9px;font-size:12.5px;font-weight:700;color:var(--fg-2)}
.act.share{margin-left:auto}

/* ---------- right rail ---------- */
.rail-r{position:sticky;top:0;height:100vh;overflow:auto;padding:30px 24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.rr-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.rr-title{font-family:var(--f-display);font-size:25px;font-weight:800;letter-spacing:-.03em;margin:10px 0 7px;line-height:1.1}
.rr-sub{color:var(--muted);font-size:13px;margin:0 0 6px}
.rank{display:flex;gap:15px;padding:19px 4px;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .no{font-family:var(--f-mono);font-size:13px;color:var(--faint);font-weight:700;padding-top:3px;width:18px;flex:none}
.rank .rbody{min-width:0;flex:1}
.rank .rcat{font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;font-weight:700}
.rank .rval{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.rank .rlabel{font-size:14px;color:var(--fg-2);font-weight:600}
.rank .rdelta{font-family:var(--f-mono);font-size:12px;margin-top:7px;display:flex;align-items:center;gap:5px}
.rank .rdelta.up{color:var(--good)} .rank .rdelta.down{color:var(--bad)}
.rr-foot{display:flex;align-items:center;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}
.rr-foot .d{width:7px;height:7px;border-radius:50%;background:var(--good)}

/* ---------- profile / empty ---------- */
.panel{background:var(--surface-2);border-radius:24px;padding:30px}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty svg{width:40px;height:40px;stroke:var(--faint);margin-bottom:14px}
.empty b{font-family:var(--f-display);display:block;color:var(--fg);font-size:18px;margin-bottom:5px;font-weight:700}

.searchwrap{overflow:hidden;max-height:0;transition:max-height .22s ease}
.searchwrap.open{max-height:70px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;font-size:15px;color:var(--fg);margin:2px 0 18px;font-family:inherit}
.search:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* recommendation UI */
.algostat{font-family:var(--f-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:20px;font-weight:700;white-space:nowrap}
.exp{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--c-science);background:var(--c-science-bg);padding:4px 8px;border-radius:7px;white-space:nowrap}
.act.ni{margin-left:auto}
.act.ni:hover{color:var(--bad)}
.act.share{margin-left:0}
.onboard{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid var(--accent-soft);border-radius:24px;padding:20px 22px;margin-bottom:20px}
.ob-h{font-family:var(--f-display);font-size:20px;font-weight:800;margin-bottom:4px}
.ob-sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.ob-chips{display:flex;flex-wrap:wrap;gap:10px}
.ob-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:20px;font-weight:600;font-size:14px;color:var(--fg-2)}

// smooth monthly trend from s0 -> end over n points
function trend(s0,end,n,wob,seed){
  const a=[];for(let i=0;i<n;i++){const t=n>1?i/(n-1):1;
    let v=s0+(end-s0)*t;                 // linear trend, no easing curve
    const h=Math.sin(i*12.9898+seed*78.233)*43758.5453; // deterministic jitter → sharp peaks/lows
    v+=((h-Math.floor(h))*2-1)*wob;
    a.push(+v.toFixed(3));}
  if(n>0)a[n-1]=end;                    // land exactly on the 2026 figure
  return a;
}
function parseFmt(num){
  const t=(""+num).trim();
  return {plus:t.startsWith("+"),cur:t.includes("$"),
    suf:(t.match(/([%A-Za-z°]+)\s*$/)||[])[1]||"",
    dec:((t.replace(/[^0-9.]/g,"").split(".")[1])||"").length};
}
function parseNum(num){
  const t=(""+num).trim();
  const neg=t.startsWith("-")||t.includes("-$");
  const n=parseFloat(t.replace(/[^0-9.]/g,""));
  return (neg?-1:1)*(isNaN(n)?0:n);
}
function fnum(v,f){
  const sign=v<0?"-":(f.plus?"+":"");

  return sign+(f.cur?"$":"")+s+(f.suf||"");
}

/* ---------- time helpers (month-absolute) ---------- */
function mLabel(abs,span){
  const y=Math.floor(abs/12), m=((abs%12)+12)%12;
  return span>24?String(y):(MON[m]+" "+y);
}
function effPeriod(d){ const ov=cardRanges[d.id]; return ov!=null?ov:PERIOD; }
function winLen(d){                     // how many points the current Range shows
  const full=d.series.length, p=effPeriod(d);
  return p==="max"?full:Math.min(full,p+1);
}
function viewOf(d){
  const L=winLen(d);
  return {s:d.series.slice(d.series.length-L), startAbs:END_ABS-(L-1), span:L-1};
}
function timeTicks(span,startAbs){
  let n=span>=48?6:span>=18?5:span>=6?4:span+1;
  n=Math.max(2,Math.min(6,n));
  const out=[];for(let i=0;i<n;i++)out.push(mLabel(Math.round(startAbs+span*i/(n-1)),span));
  return out;
}
function rangeLabel(startAbs,span){
  const f=a=>span>24?String(Math.floor(a/12)):(MON[((a%12)+12)%12]+" "+Math.floor(a/12));
  return f(startAbs)+" – "+f(END_ABS);
}

/* ============================================================
   Recommendation engine
   - interest vector per topic, updated by weighted signals
   - 3 phases by interaction count → exploration rate
   - explore slots inject experimental stats more aggressively than TikTok
   ============================================================ */
const ALGO={ iv:store.get("iv",{}), seen:store.get("seen",{}), ic:store.get("ic",0) };
const WEIGHT={like:2,unlike:-2,save:6,unsave:-6,comment:7,share:5,open:3,notint:-8};
function algoSave(){store.set("iv",ALGO.iv);store.set("seen",ALGO.seen);store.set("ic",ALGO.ic);}
function phaseInfo(){
  const n=ALGO.ic;
  if(n<5)  return {name:"Calibrating",explore:0.80,tag:"80% new"};
  if(n<30) return {name:"Learning",   explore:0.45,tag:"45% new"};
  return             {name:"Tuned",     explore:0.18,tag:"18% new"};
}
function applySignal(cat,w,meaningful){
  if(!cat)return;
  ALGO.iv[cat]=(ALGO.iv[cat]||0)+w;
  if(meaningful)ALGO.ic++;
  algoSave(); updateStatus();
}
function bumpSeen(cat){ALGO.seen[cat]=(ALGO.seen[cat]||0)+1;algoSave();}
function updateStatus(){const el=document.getElementById("algoStatus");if(el){const p=phaseInfo();el.textContent=p.name+" · "+p.tag;}}

// dwell weights from the spec
function dwellWeight(dt){
  if(dt<0.5)return [-1,false];   // scrolled past without pausing
  if(dt<1)  return [-2,false];   // fast skip
  if(dt<3)  return [-0.5,false]; // glanced
  if(dt<8)  return [1,false];    // read headline + number
  if(dt<20) return [3,true];     // read the chart
  return [5,true];               // studied it
}
function recordDwell(id,dt){
  const d=DATA.find(x=>x.id===id); if(!d)return;
  bumpSeen(d.cat);
  const [w,strong]=dwellWeight(dt);
  applySignal(d.cat,w,strong);
}
let dwellMap=new Map(), observed=new WeakSet();
const io=new IntersectionObserver(es=>es.forEach(en=>{
  const id=en.target.dataset.id;if(!id)return;
  if(en.isIntersecting&&en.intersectionRatio>=0.5){ if(!dwellMap.has(id))dwellMap.set(id,performance.now()); }
  else if(dwellMap.has(id)){ recordDwell(id,(performance.now()-dwellMap.get(id))/1000); dwellMap.delete(id); }
}),{threshold:[0,0.5,1]});
function flushDwell(){const now=performance.now();dwellMap.forEach((t,id)=>recordDwell(id,(now-t)/1000));dwellMap.clear();}
function observeNew(){document.querySelectorAll(".card").forEach(c=>{if(!observed.has(c)){observed.add(c);io.observe(c);}});}

// round-robin across topics so a batch is never "straight sports"
function diversePool(list){
  const b={}; list.forEach(d=>{(b[d.cat]=b[d.cat]||[]).push(d);});
  Object.values(b).forEach(a=>a.sort(()=>Math.random()-0.5));
  const cats=Object.keys(b).sort((x,y)=>(ALGO.seen[x]||0)-(ALGO.seen[y]||0));  // least-seen topics first
  const out=[]; let go=true;
  while(go){go=false;cats.forEach(c=>{if(b[c].length){out.push(b[c].shift());go=true;}});}
  return out;
}
// order a candidate list: exploit (affinity) interleaved with exploration (diverse)
function rankFeed(list){
  const p=phaseInfo(), explore=p.name==="Calibrating"?1:p.explore, badge=p.name!=="Calibrating";
  const exploit=list.map(d=>({d,s:(ALGO.iv[d.cat]||0)+Math.log10(1+d.up)*0.4}))
                    .sort((a,b)=>b.s-a.s).map(x=>x.d);
  const pool=diversePool(list);
  const out=[],used=new Set();let ei=0,pi=0;
  while(out.length<list.length){
    let pick=null,exp=false;
    if(Math.random()<explore){
      while(pi<pool.length&&used.has(pool[pi].id))pi++;
      if(pi<pool.length){pick=pool[pi++];exp=badge;}
    }
    if(!pick){ while(ei<exploit.length&&used.has(exploit[ei].id))ei++; if(ei<exploit.length)pick=exploit[ei++]; }
    if(!pick){ const rem=list.find(d=>!used.has(d.id)); if(!rem)break; pick=rem; }
    used.add(pick.id); out.push({d:pick,exp});
  }
  return out;
}

// endless feed: a freshly-ranked set of 3 loads as you reach the bottom
const BATCH=3; let feedShown=new Set(), loadIO=null;
function appendBatch(){
  const sent=document.getElementById("feedSentinel"); if(!sent)return;
  let pool=visible().filter(d=>!feedShown.has(d.id));
  if(!pool.length){ feedShown=new Set(); pool=visible(); }   // loop endlessly with a fresh ranking
  if(!pool.length)return;
  const ranked=rankFeed(pool).slice(0,BATCH);
  ranked.forEach(e=>feedShown.add(e.d.id));
  sent.insertAdjacentHTML("beforebegin",ranked.map(e=>card(e.d,e.exp)).join(""));
  bindCharts(); observeNew();
}
function setupLoadObserver(){
  if(loadIO)loadIO.disconnect();
  const sent=document.getElementById("feedSentinel"); if(!sent)return;
  loadIO=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))appendBatch();},{rootMargin:"700px"});
  loadIO.observe(sent);
}

/* ---------- chart ---------- */
const CH={W:440,H:188,padL:74,padR:16,padT:16,padB:26};
function chart(d){
  const {W,H,padL,padR,padT,padB}=CH, v=viewOf(d), s=v.s, n=s.length;
  const min=Math.min(...s),max=Math.max(...s),span=(max-min)||1,mid=(max+min)/2;
  const baseY=H-padB, col=CATS[d.cat].c, gid="g_"+d.id, f=d.fmt;
  const tt=timeTicks(v.span,v.startAbs);
  const X=i=>padL+(i/Math.max(1,n-1))*(W-padL-padR);
  const Y=val=>padT+(1-(val-min)/span)*(H-padT-padB);
  let line="";s.forEach((val,i)=>line+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(val).toFixed(1)+" ");
  const area="M"+padL+" "+baseY+" "+line.replace(/^M/,"L")+"L"+X(n-1).toFixed(1)+" "+baseY;
  let grid="";[max,mid].forEach(val=>{const gy=Y(val).toFixed(1);
    grid+=`<line x1="${padL}" x2="${W-padR}" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-dasharray="3 5"/>`;});
  let axes=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${baseY}" stroke="var(--axis)" stroke-width="1.4"/>`
    +`<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--axis)" stroke-width="1.4"/>`;
  tt.forEach((t,i)=>{const px=(padL+(i/Math.max(1,tt.length-1))*(W-padL-padR)).toFixed(1);
    axes+=`<line x1="${px}" x2="${px}" y1="${baseY}" y2="${baseY+4}" stroke="var(--axis)" stroke-width="1"/>`;});
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity="0.30"/><stop offset="1" stop-color="${col}" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${grid}${axes}
    <path d="${area}Z" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="2" vector-effect="non-scaling-stroke"/>
  </svg>`;
  const yp=val=>(Y(val)/H*100).toFixed(2), xp=i=>(X(i)/W*100).toFixed(2);
  const ylabs=[max,mid,min].map(val=>
    `<div class="caxis y" style="top:${yp(val)}%;width:${((padL-10)/W*100).toFixed(2)}%">${fnum(val,f)}</div>`).join("");
  const xlabs=tt.map((t,i)=>{const px=((padL+(i/Math.max(1,tt.length-1))*(W-padL-padR))/W*100).toFixed(2);
    return `<div class="caxis x" style="left:${px}%">${t}</div>`;}).join("");
  return `<div class="chartwrap" data-id="${d.id}" style="--dotc:${col}" role="img" aria-label="${d.label} trend">
    ${svg}${ylabs}${xlabs}
    <div class="cunit">${d.unit}</div>
    <div class="cvline"></div>
    <div class="cend" style="left:${xp(n-1)}%;top:${yp(s[n-1])}%"></div>
    <div class="cdot"></div>
    <div class="ctip"></div>
  </div>`;
}
function bindCharts(){
  const {W,H,padL,padR,padT,padB}=CH;
  document.querySelectorAll(".chartwrap").forEach(wrap=>{
    if(wrap._bound)return; wrap._bound=true;         // bind each chart only once
    const d=DATA.find(x=>x.id===wrap.dataset.id);if(!d)return;
    const v=viewOf(d), s=v.s, n=s.length, f=d.fmt;
    const min=Math.min(...s),max=Math.max(...s),span=(max-min)||1;
    const dot=wrap.querySelector(".cdot"),vline=wrap.querySelector(".cvline"),
          tip=wrap.querySelector(".ctip"),end=wrap.querySelector(".cend");
    const Xp=i=>(padL+(i/Math.max(1,n-1))*(W-padL-padR))/W*100;
    const Yp=val=>(padT+(1-(val-min)/span)*(H-padT-padB))/H*100;
    function move(clientX){
      const r=wrap.getBoundingClientRect();if(!r.width)return;
      const vbx=(clientX-r.left)/r.width*W;
      let idx=Math.round(((vbx-padL)/(W-padL-padR))*(n-1));
      idx=Math.max(0,Math.min(n-1,idx));
      const val=s[idx], x=Xp(idx)+"%", y=Yp(val)+"%", frac=n>1?idx/(n-1):0;
      dot.style.left=x;dot.style.top=y;
      tip.style.left=x;tip.style.top=y;
      tip.innerHTML=fnum(val,f)+'<small>'+mLabel(Math.round(v.startAbs+v.span*frac),0)+' · '+d.unit+'</small>';
      vline.style.left=x;vline.style.top=(padT/H*100)+"%";vline.style.height=((H-padT-padB)/H*100)+"%";
      wrap.classList.add("hovering");if(end)end.style.opacity="0";
    }
    wrap.addEventListener("pointermove",e=>move(e.clientX));
    wrap.addEventListener("pointerdown",e=>move(e.clientX));
    wrap.addEventListener("pointerleave",()=>{wrap.classList.remove("hovering");if(end)end.style.opacity="";});
  });
}

/* ---------- non-time-series charts (rankings, breakdowns, compositions) ---------- */
const PAL=["#4b57f5","#17a06a","#e0533b","#d99a1f","#7c5cff","#3b7de0","#e86aa6","#2bb3b3"];
function fmtItem(v,d){return (d.pfx||"")+v.toLocaleString("en-US",{minimumFractionDigits:d.idec||0,maximumFractionDigits:d.idec||0})+(d.sfx||"");}
function barsHTML(d){
  const max=Math.max(...d.items.map(x=>x.v));
  return `<div class="barchart">`+d.items.map((it,i)=>{
    const h=Math.max(6,it.v/max*100);
    return `<div class="bar" title="${it.n}: ${fmtItem(it.v,d)}">
      <span class="bv">${fmtItem(it.v,d)}</span>
      <div class="bwrap"><div class="bcol" style="height:${h}%;background:${PAL[i%PAL.length]}"></div></div>
      <span class="bn">${it.n}</span></div>`;}).join("")+`</div>`;
}
function hbarsHTML(d){
  const max=Math.max(...d.items.map(x=>x.v));
  return `<div class="hbars">`+d.items.map((it,i)=>
    `<div class="hrow" title="${it.n}: ${fmtItem(it.v,d)}">
      <span class="hn">${it.n}</span>
      <div class="htrack"><div class="hfill" style="width:${Math.max(3,it.v/max*100)}%;background:${PAL[i%PAL.length]}"></div></div>
      <span class="hv">${fmtItem(it.v,d)}</span></div>`).join("")+`</div>`;
}
function donutHTML(d){
  const total=d.items.reduce((a,x)=>a+x.v,0),r=54,cx=66,cy=66,c=2*Math.PI*r; let acc=0;
  const segs=d.items.map((it,i)=>{const len=it.v/total*c;
    const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc+=len;return s;}).join("");
  const legend=d.items.map((it,i)=>
    `<div class="leg"><span class="ld" style="background:${PAL[i%PAL.length]}"></span><span class="ln">${it.n}</span><span class="lv">${fmtItem(it.v,d)}</span></div>`).join("");
  return `<div class="donutwrap"><svg class="donut" viewBox="0 0 132 132" width="132" height="132" aria-hidden="true">${segs}</svg><div class="legend">${legend}</div></div>`;
}

/* ---------- card ---------- */
function sinceEl(d){
  const v=viewOf(d), s=v.s, diff=s[s.length-1]-s[0], f=d.fmt;
  const dir=diff>=0?"up":"down", arw=diff>=0?"↑":"↓", sign=diff>=0?"+":"−";
  const nf=Math.abs(diff).toLocaleString("en-US",{minimumFractionDigits:f.dec,maximumFractionDigits:f.dec});
  let body;
  if(f.cur) body="$"+nf+(f.suf||"");
  else if(f.suf==="%") body=nf+" pts";
  else if(f.suf) body=nf+f.suf;
  else body=nf+" "+(d.unit.split(/[ ,]/)[0]||"");
  return `<div class="since ${dir}"><span class="arw">${arw}</span>${sign}${body}<em>since ${mLabel(v.startAbs,v.span)}</em></div>`;
}
function card(d,exp){

  const crHtml=`<div class="cardrange" title="Range shown for this statistic">`+crBtns.join("")+`</div>`;

    <div class="card-body">
      <div>
        <div class="stat-num">${d.num}</div>
        <div class="stat-label">${d.label}</div>
        <div class="stat-range">${rangeLabel(v.startAbs,v.span)}</div>
        ${sinceEl(d)}
      </div>
      ${chart(d)}
    </div>
    <dl class="meta">
      <div><dt>Source</dt><dd>${d.src}${d.verified?'<span class="verified">✓</span>':''}</dd></div>
      <div><dt>Last updated</dt><dd>${d.updated}</dd></div>
    </dl>
    <div class="actions">
      <button class="act up ${isUp?"on":""}" data-act="up">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
        <span class="count">${fmt(up)}</span>
      </button>
      <button class="act" data-act="debate">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.3 7.3L3 21l1.7-6.7A8 8 0 1 1 21 12Z"/></svg>
        Debate <span class="badge">${d.debate}</span>
      </button>
      <button class="act ni" data-act="notint" title="Not interested" aria-label="Not interested">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>
      </button>
      <button class="act share" data-act="share">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.3"/><circle cx="17" cy="6" r="2.3"/><circle cx="17" cy="18" r="2.3"/><path d="M8 11 15 7M8 13l7 4"/></svg>

function fmt(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":""+n}

let view="feed", tab="latest", topicFilter=null, query="";
function visible(){
  let list=DATA.slice().filter(d=>!hidden.has(d.id));
  if(view==="saved") list=list.filter(d=>saved.has(d.id));
  if(topicFilter) list=list.filter(d=>d.cat===topicFilter);
  if(query){const q=query.toLowerCase();
    list=list.filter(d=>(d.label+" "+d.src+" "+CATS[d.cat].name+" "+d.num+" "+regionFor(d)[1]).toLowerCase().includes(q));}
  if(tab==="debated") list.sort((a,b)=>b.debate-a.debate);
  else if(tab==="following") list=list.filter(d=>d.verified);
  return list;
}
function renderCards(){
  const el=document.getElementById("cards");
  flushDwell();
  if(loadIO){loadIO.disconnect();loadIO=null;}
  if(view==="profile"){ el.innerHTML=profilePanel(); updateStatus(); return; }
  const list=visible();
  if(!list.length){
    el.innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>
      <b>${view==="saved"?"No saved statistics yet":"Nothing matches"}</b>
      ${view==="saved"?"Tap the bookmark on any card to keep it here.":"Try a different topic or search."}
    </div>`;
    updateStatus(); return;
  }
  if(view==="feed"&&tab==="latest"&&!query){        // personalized endless feed, 3 at a time
    feedShown=new Set();
    const onboard=(phaseInfo().name==="Calibrating")?onboardingHTML():"";
    el.innerHTML=onboard+'<div id="feedSentinel" style="height:1px"></div>';
    appendBatch(); appendBatch();
    setupLoadObserver();
  }else{                                            // finite lists render in full
    el.innerHTML=list.map(d=>card(d,false)).join("");
    bindCharts(); observeNew();
  }
  updateStatus();
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1900);}

document.getElementById("cards").addEventListener("click",e=>{
  const ob=e.target.closest("[data-ob]");
  if(ob){applySignal(ob.dataset.ob,4,true);bumpSeen(ob.dataset.ob);toast("Added "+CATS[ob.dataset.ob].name+" to your interests");renderCards();return;}
  const crb=e.target.closest("button[data-cr]");
  if(crb){const a0=e.target.closest(".card");if(a0){cardRanges[a0.dataset.id]=crb.dataset.cr==="max"?"max":+crb.dataset.cr;renderCards();}return;}
  const art=e.target.closest(".card");if(!art)return;
  const id=art.dataset.id, d=DATA.find(x=>x.id===id);
  const btn=e.target.closest("[data-act]");
  if(!btn){ openDetail(id); return; }        // tap the card body = open detail (+3)
  const act=btn.dataset.act;
  if(act==="save"){
    if(saved.has(id)){saved.delete(id);applySignal(d.cat,WEIGHT.unsave,false);toast("Removed from saved");}
    else{saved.add(id);applySignal(d.cat,WEIGHT.save,true);toast("Saved");}
    store.set("saved",[...saved]);
    if(view==="saved"||view==="profile"){renderCards();}else{btn.classList.toggle("on",saved.has(id));}
  }else if(act==="up"){
    const was=voted.has(id);
    if(was){voted.delete(id);applySignal(d.cat,WEIGHT.unlike,false);}else{voted.add(id);applySignal(d.cat,WEIGHT.like,true);}
    store.set("voted",[...voted]);
    btn.classList.toggle("on",!was);
    btn.querySelector(".count").textContent=fmt(d.up+(voted.has(id)?1:0));
  }else if(act==="debate"){
    applySignal(d.cat,WEIGHT.comment,true);toast("Debate thread · "+d.debate+" arguments");
  }else if(act==="share"){
    applySignal(d.cat,WEIGHT.share,true);
    const text=`${d.num} — ${d.label} (${d.src}) via Statline`;
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(()=>toast("Copied to clipboard")).catch(()=>toast(text));
    else toast(text);
  }else if(act==="notint"){
    applySignal(d.cat,WEIGHT.notint,true);hidden.add(id);toast("Got it — fewer like this");renderCards();
  }
});
